<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác minh bảo mật</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-100">

    <main class="w-full max-w-sm">
        <div class="bg-slate-800/90 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700/80 p-6 sm:p-8 text-center transition-all duration-300">
            
            <!-- Header Icon & Title -->
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-blue-500/10 text-blue-400 mb-4 border border-blue-500/20 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <h1 class="text-xl font-bold text-white mb-1">Xác minh bảo mật</h1>
            <p class="text-xs text-slate-400 mb-6">Vui lòng hoàn thành xác minh để tiếp tục truy cập</p>

            <div id="recaptcha-box" class="bg-slate-900/70 border border-slate-700 rounded-xl p-4 flex items-center justify-between mb-6 shadow-inner cursor-pointer select-none transition-all hover:border-slate-500" onclick="handleCaptchaClick()">
                <div class="flex items-center space-x-3">
                    <div id="checkbox-container" class="w-7 h-7 bg-slate-800 border-2 border-slate-600 rounded flex items-center justify-center transition-colors shadow-inner">
                        <!-- Checkmark or Spinner will be injected here -->
                    </div>
                    <span class="text-sm font-medium text-slate-200 select-none">Tôi không phải người máy</span>
                </div>
                <!-- Fake reCAPTCHA branding -->
                <div class="flex flex-col items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-blue-500 mb-0.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                    <span class="text-[9px] text-slate-400 font-semibold tracking-tighter">reCAPTCHA</span>
                </div>
            </div>

            <button id="continue-btn" onclick="handleContinue()" disabled class="w-full py-3.5 px-4 rounded-xl font-semibold text-sm transition-all duration-200 bg-slate-700 text-slate-400 cursor-not-allowed shadow-none">
                Continue
            </button>
        </div>
    </main>

    <div onclick="handleSecretClick()" class="fixed bottom-3 right-3 p-3 opacity-10 hover:opacity-100 transition-opacity duration-300 cursor-pointer select-none" title="Secret">
        <div class="w-2 h-2 rounded-full bg-slate-400"></div>
    </div>

    <script>
        let isVerified = false;
        let secretClicks = 0;
        let secretTimer = null;

        function handleCaptchaClick() {
            if (isVerified) return;

            const checkboxContainer = document.getElementById('checkbox-container');
            const recaptchaBox = document.getElementById('recaptcha-box');
            
            recaptchaBox.style.pointerEvents = 'none';

            checkboxContainer.innerHTML = `
                <svg class="w-5 h-5 text-blue-400 animate-spin-slow" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            `;

            setTimeout(() => {
                isVerified = true;
                checkboxContainer.innerHTML = `
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                    </svg>
                `;
                checkboxContainer.classList.remove('border-slate-600', 'bg-slate-800');
                checkboxContainer.classList.add('border-emerald-500', 'bg-emerald-950/50');

                const continueBtn = document.getElementById('continue-btn');
                continueBtn.disabled = false;
                continueBtn.classList.remove('bg-slate-700', 'text-slate-400', 'cursor-not-allowed');
                continueBtn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white', 'shadow-lg', 'shadow-blue-600/30', 'cursor-pointer');
                
                recaptchaBox.style.pointerEvents = 'auto';
                recaptchaBox.style.cursor = 'default';
            }, 1000);
        }

        function handleContinue() {
            if (!isVerified) return;
            window.location.href = 'troll.html';
        }

        function handleSecretClick() {
            secretClicks++;
            clearTimeout(secretTimer);
            secretTimer = setTimeout(() => {
                secretClicks = 0;
            }, 2000);

            if (secretClicks === 4) {
                window.location.href = 'game.html';
            }
        }
    </script>
</body>
</html>
