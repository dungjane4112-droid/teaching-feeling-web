<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Mod Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #11111d);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            font-size: 1.2rem;
            line-height: 1.6;
            font-weight: 500;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        .highlight {
            color: #00d2ff;
            font-weight: bold;
        }

        .btn-continue {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            padding: 14px 40px;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }

        .btn-continue:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
            background: linear-gradient(45deg, #3a7bd5, #00d2ff);
        }

        .btn-continue:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>
            Trò chơi này thuộc về<span class="highlight">ichibikun(Facebook)</span>,<br>
            phiên bản web bởi <span class="highlight">aoc studio</span>.
        </h1>
        
        <a href="game.html" class="btn-continue">CONTINUE</a>
    </div>

</body>
</html>
