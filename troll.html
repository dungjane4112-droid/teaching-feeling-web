<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Video covers/fits screen without distortion, centered on pure black background */
        #trollVideo {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background-color: #000000;
            display: block;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

    <video 
        id="trollVideo" 
        src="troll.mp4" 
        autoplay 
        muted 
        playsinline 
        preload="auto">
    </video>

    <script>
        (function() {
            const video = document.getElementById('trollVideo');
            let redirected = false;

            // Seamless redirect function to game.html
            function goToGame() {
                if (!redirected) {
                    redirected = true;
                    window.location.href = 'game.html';
                }
            }

            // Redirect as soon as video finishes playing
            video.addEventListener('ended', goToGame);

            // Backup safety listener using video time updates
            video.addEventListener('timeupdate', function() {
                if (video.duration && video.currentTime >= (video.duration - 0.2)) {
                    goToGame();
                }
            });

            // Handle potential playback errors
            video.addEventListener('error', function() {
                goToGame();
            });

            // Execute play programmatically on load
            function triggerAutoplay() {
                video.muted = true; // Required by modern browser policies for zero-prompt autoplay
                const playPromise = video.play();
                
                if (playPromise !== undefined) {
                    playPromise.catch(function() {
                        // If browser restricts initial load, retry immediately
                        video.play();
                    });
                }
            }

            // Invisible interaction listener (unmutes/ensures play without any visual element)
            function handleSilentInteraction() {
                if (video.paused) {
                    video.play();
                }
                video.muted = false; // Unmute sound upon invisible user tap
            }

            // Event listeners for window load and silent taps
            window.addEventListener('DOMContentLoaded', triggerAutoplay);
            window.addEventListener('load', triggerAutoplay);
            document.addEventListener('click', handleSilentInteraction, { once: true });
            document.addEventListener('touchstart', handleSilentInteraction, { once: true });
        })();
    </script>
</body>
</html>
