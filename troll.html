<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Video covers/fits screen without distortion, centered on pure black background */
        #trollVideo {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background-color: #000000;
            display: block;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

    <video 
        id="trollVideo" 
        autoplay 
        muted 
        playsinline 
        preload="auto">
        <source src="troll.mp4" type="video/mp4">
        Trình duyệt của bạn không hỗ trợ thẻ video.
    </video>

    <script>
        (function() {
            const video = document.getElementById('trollVideo');
            let redirected = false;

            if (!video) {
                console.error('Không tìm thấy phần tử video với id "trollVideo"');
                return;
            }

            // Seamless redirect function to game.html
            function goToGame() {
                if (!redirected) {
                    redirected = true;
                    window.location.href = 'game.html';
                }
            }

            // Redirect as soon as video finishes playing
            video.addEventListener('ended', goToGame);

            // Backup safety listener using video time updates
            video.addEventListener('timeupdate', function() {
                if (video.duration && video.currentTime >= (video.duration - 0.2)) {
                    goToGame();
                }
            });

            // Handle potential playback errors
            video.addEventListener('error', function() {
                console.warn('Lỗi phát video, chuyển hướng...');
                goToGame();
            });

            // Execute play programmatically on load
            function triggerAutoplay() {
                // Keep muted for autoplay to be allowed by browsers
                video.muted = true; // Required by modern browser policies for zero-prompt autoplay
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function(err) {
                        // If browser restricts initial load, wait for a user gesture
                        console.warn('Autoplay bị chặn, chờ tương tác người dùng:', err);
                    });
                }
            }

            // Interaction listener to ensure playback / optionally unmute on user gesture
            function handleUserInteraction() {
                if (video.paused) {
                    video.play().catch(function(e) {
                        console.warn('Không thể play sau tương tác:', e);
                    });
                }
                // Optional: unmute only if you want sound after user's gesture
                // video.muted = false;
            }

            // Event listeners for window load and user gestures
            window.addEventListener('DOMContentLoaded', triggerAutoplay);
            window.addEventListener('load', triggerAutoplay);
            document.addEventListener('click', handleUserInteraction, { once: true });
            document.addEventListener('touchstart', handleUserInteraction, { once: true });
        })();
    </script>
</body>
</html>
