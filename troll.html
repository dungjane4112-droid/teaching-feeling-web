<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troll Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-black w-screen h-screen flex items-center justify-center">

    <video 
        id="trollVideo" 
        src="troll.mp4" 
        autoplay 
        muted 
        playsinline 
        class="w-full h-full object-cover bg-black">
    </video>

    <script>
        const video = document.getElementById('trollVideo');
        
        // Automatically redirect to game.html when the video finishes
        video.addEventListener('ended', () => {
            window.location.href = 'game.html';
        });

        // Ensure playback triggers immediately
        video.play().catch(err => {
            console.log("Autoplay handled silently:", err);
        });
    </script>
</body>
</html>
